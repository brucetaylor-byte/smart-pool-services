<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a1e;--card:#12282e;--ink:#e6f2f4;--mute:#8fa8ae;--line:#24424a;--aqua:#38b6ee;--brand:#2db2ee;--deep:#2b4350;--okbg:#12362a;--warnbg:#3a2c0f;--badbg:#3d1c17;--ok:#52c585;--warn:#f0a93a;--bad:#f27a69}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:Nunito,Figtree,sans-serif;margin:0;line-height:1.15}
.app{max-width:430px;margin:0 auto;min-height:100vh;padding:16px 14px 90px}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 2px 14px}
.top h1{font-size:26px}.top small{color:var(--mute)}
.pill{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--okbg);color:var(--ok)}
.pill.one{background:var(--warnbg);color:var(--warn)}
.map{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;margin-bottom:12px}

.job{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;display:grid;grid-template-columns:34px 1fr;gap:12px}
.n{width:34px;height:34px;border-radius:50%;background:var(--deep);color:#fff;display:grid;place-items:center;font-weight:700}
.job.done .n{background:var(--ok)}
.job h3{font-size:18px}.job p{margin:2px 0 6px;color:var(--mute);font-size:14px}
.access{font-size:13px;background:var(--bg);border-radius:8px;padding:6px 9px;margin:6px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;background:var(--aqua);color:#1d1d1b;min-height:44px}
button.alt{background:transparent;color:var(--ink);border:1.5px solid var(--aqua)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.back{background:none;color:var(--ink);padding:6px 0;min-height:0;margin-bottom:6px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 16px}
.bar i{display:block;height:100%;background:var(--brand);transition:width .3s}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.step>header{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;width:100%;text-align:left;background:none;border:0;color:var(--ink);font-weight:600;border-radius:0}
.step .dot{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--mute)}
.step.ok .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.body{display:none;padding:0 14px 14px}.step.open .body{display:block}
.chk{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.chk input{width:22px;height:22px;accent-color:var(--aqua)}
.fld{display:grid;grid-template-columns:1fr 96px;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.fld input,textarea{font:inherit;width:100%;padding:9px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.fld small{grid-column:1/-1;font-weight:600}
.fld small.ok{color:var(--ok)}.fld small.low,.fld small.high{color:var(--warn)}
.hint{color:var(--mute);font-size:14px;margin:0 0 8px}
.time{font-size:22px;font-weight:600;font-family:Nunito,sans-serif}
.done-card{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 18px}
.done-card h2{margin-bottom:6px}
.note{font-size:13px;color:var(--mute);text-align:center;margin-top:16px}
.brandbar{background:#fff;border-bottom:4px solid var(--brand);padding:8px 14px calc(8px + env(safe-area-inset-top,0px))}.brandbar div{max-width:430px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}.brandbar img{height:58px;width:auto;display:block}.brandbar span{font-family:Nunito,sans-serif;font-weight:800;color:#1d1d1b;font-size:15px}
.brandbar span{font-size:13px!important;display:flex;align-items:center}.sign{padding:4px 10px;min-height:34px;font-size:13px;margin-left:8px}.login,.tech{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:10px}.tech{margin:10px 0}.lab{display:block;font-weight:600;margin-top:10px}.lab input,.lab select,.mj select{font:inherit;width:100%;margin-top:4px;padding:10px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}.mj select{width:auto;margin:0}.mj{padding:10px 0;border-top:1px solid var(--line)}.mj h3{font-size:16px}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.days button{padding:8px 2px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);font-size:14px;line-height:1.2}.days button small{display:block;font-weight:500;color:var(--mute);font-size:11px}.days button.on{background:var(--brand);border-color:var(--brand);color:#1d1d1b}.days button.on small{color:#1d1d1b}
.days.tabs{grid-template-columns:1fr 1fr;margin-bottom:12px}.btn{display:inline-flex;align-items:center;font-weight:600;border-radius:10px;padding:11px 16px;min-height:44px;background:var(--aqua);color:#1d1d1b;text-decoration:none}.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--aqua)}.srch{font:inherit;width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}.crow{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-bottom:8px;padding:12px 14px;font-weight:400}.crow b{display:block;font-size:16px}.crow span{display:block;color:var(--mute);font-size:14px}.crow .pill{display:inline-block;margin-top:6px;font-style:normal}
.sum{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font:14px/1.5 ui-monospace,Menlo,monospace;margin:8px 0}.dose{border-top:1px solid var(--line);margin-top:6px;padding-top:4px}.step h3{font-size:16px;margin:10px 0 2px}textarea{margin-top:4px}
</style>

 L.forEach(function(c){h+='<button class="crow" data-cust="'+c.id+'"><b>'+c.name+'</b><span>'+c.addr+'</span><span>'+(c.phone||'No phone on file')+'</span><em class="pill'+(c.freq?'':' one')+'">'+(c.freq?'Repeat: '+c.freq:'One-off')+'</em></button>'});return h}
function opts(a){return a.map(function(x,i){return '<option value="'+i+'">'+x+'</option>'}).join('')}
function sched(p){return '<label class="lab">Frequency<select id="'+p+'-freq"><option>Weekly</option><option>Fortnightly</option><option>Monthly</option></select></label><label class="lab">Day<select id="'+p+'-day">'+opts(DN).replace('value="'+TODAY+'"','value="'+TODAY+'" selected')+'</select></label><label class="lab">Technician<select id="'+p+'-tech"><option>Sam</option><option>Jo</option></select></label>'}
function card(c){var h='<button class="back" data-cback>‹ Customers</button><h2>'+c.name+'</h2><p class="hint">'+c.addr+'</p><div class="row" style="margin-bottom:10px">'+(c.phone?'<a class="btn" href="tel:'+c.phone.replace(/\s/g,'')+'">Call '+c.phone+'</a>':'<span class="hint">No phone on file</span>')+(c.email?'<a class="btn alt" href="mailto:'+c.email+'">Email</a>':'')+'<a class="btn alt" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.addr)+'">Map</a></div>';
 h+='<div class="tech"><h3>Schedule</h3><p style="margin:6px 0">'+(c.freq?'<span class="pill">Repeat: '+c.freq+'</span> '+DN[c.day]+'s with '+c.tech:'<span class="pill one">One-off</span> No repeat schedule yet')+'</p>';
 if(!c.freq&&st.recur!=c.id)h+='<button style="width:100%;margin-top:6px" data-recur="'+c.id+'">Make recurring</button>';
 if(st.recur==c.id)h+=sched('rc')+'<p class="hint" style="margin-top:8px">The first repeat visit is added to that day this week.</p><button style="width:100%" data-saverecur="'+c.id+'">Save schedule</button>';
 h+='</div><div class="tech"><h3>Access notes</h3><p style="margin:6px 0">'+(c.access||'None yet.')+'</p></div><div class="tech"><h3>Visit history</h3>';
 ALL.filter(function(j){return j.name==c.name}).sort(function(a,b){return a.day-b.day}).forEach(function(j){var d=st.data[j.id],r=d?chem.filter(function(k){return d.r.pool[k.k]}).map(function(k){return k.l+' '+d.r.pool[k.k]}).join(', '):'';
  h+='<div class="mj"><b>'+DL[j.day]+'</b> · '+j.tech+' · '+j.type+'<br><small class="hint">'+(st.done[j.id]?'Done'+(r?'. '+r:''):'Scheduled')+'</small></div>'});
 return h+'<p class="hint" style="margin-top:10px">The live app would also show photos, the communications log and dated notes here.</p></div>'}
function custs(){var c=st.cid&&CUST.filter(function(x){return x.id==st.cid})[0];if(c)return card(c);
 var h='<div class="top"><div><h1>Customers</h1><small>'+CUST.length+' in directory</small></div></div><input id="cq" class="srch" placeholder="Search name, suburb or phone" value="'+(st.cq||'').replace(/["<&]/g,'')+'"><button style="width:100%;margin:10px 0" data-addcust>'+(st.cform?'Cancel':'Add customer')+'</button>';
 if(st.cform)h+='<div class="login" style="margin:0 0 12px"><h3>New customer</h3><label class="lab">Name<input id="nc-name"></label><label class="lab">Phone<input id="nc-phone" type="tel"></label><label class="lab">Email<input id="nc-email" type="email"></label><label class="lab">Address<input id="nc-addr" placeholder="e.g. 8 High St, Kyneton"></label><label class="lab">Access notes<input id="nc-acc" placeholder="Gate code, dogs, key"></label><label class="lab">Service<select id="nc-plan"><option>Repeat service</option><option>No schedule yet</option></select></label>'+sched('nc')+'<button style="width:100%;margin-top:12px" data-savecust>Save customer</button></div>';
 return h+'<div id="clist">'+clist()+'</div>'}
function savecust(){var n=$('#nc-name').value.trim(),a=$('#nc-addr').value.trim();if(!n||!a){alert('Enter a name and an address, like 8 High St, Kyneton.');return}
 if(a.indexOf('VIC')<0)a+=' VIC';var c={id:Date.now()%1000000,name:n,phone:$('#nc-phone').value.trim(),email:$('#nc-email').value.trim(),addr:a,access:$('#nc-acc').value.trim(),freq:'',day:0,tech:''};CUST.push(c);
 if($('#nc-plan').value=='Repeat service')mkJob(c,$('#nc-freq').value,+$('#nc-day').value,$('#nc-tech').value);st.cform=false;st.cid=c.id;render()}
function mgr(){return '<div class="days tabs"><button data-tab="week" class="'+(st.mtab=='week'?'on':'')+'">Week</button><button data-tab="cust" class="'+(st.mtab=='cust'?'on':'')+'">Customers</button></div>'+(st.mtab=='cust'?custs():week())}
function sync(){jobs=ALL.filter(function(j){return j.tech=='Sam'&&j.day==TODAY})}
function town(j){var p=j.addr.split(', ');return (p[1]||p[0]).replace(' VIC','')}
function login(){return '<div class="login"><h2>Sign in</h2><p class="hint">Demo only. The real app asks for each person’s own email and password, or emails a sign-in link.</p><label class="lab">Email<input type="email" placeholder="you@smartpoolservices.com.au" autocomplete="off"></label><label class="lab">Password<input type="password" placeholder="Password" autocomplete="off"></label><p class="hint" style="margin-top:16px">For this demo, choose an account:</p><div class="row" style="flex-direction:column;align-items:stretch"><button data-login="tech">Sign in as Sam, technician</button><button class="alt" data-login="mgr">Sign in as Alex, manager</button></div></div>'}
function week(){var D5=DAYS.map(function(d,i){return DN[i]+' '+d.getDate()}),h='<div class="top"><div><h1>Week of '+MON.toLocaleDateString('en-AU',{day:'numeric',month:'long'})+'</h1><small>All technicians</small></div></div><div class="days">';
 D5.forEach(function(l,i){var n=ALL.filter(function(j){return j.day==i}).length;h+='<button data-mday="'+i+'" class="'+(st.mday==i?'on':'')+'">'+l+'<small>'+n+' jobs</small></button>'});
 h+='</div><button class="alt" style="width:100%;margin:12px 0" data-addform>'+(st.add?'Cancel':'Add one-off job')+'</button>';
 if(st.add)h+='<div class="login" style="margin:0 0 12px"><h3>New one-off job</h3><label class="lab">Customer<input id="nj-name" placeholder="e.g. Brown residence"></label><label class="lab">Address<input id="nj-addr" placeholder="e.g. 8 High St, Kyneton"></label><label class="lab">Phone<input id="nj-phone" type="tel"></label><label class="lab">Job<select id="nj-type"><option>One-off: filter clean</option><option>One-off: pump repair</option><option>One-off: equipment install</option><option>One-off: other</option></select></label><label class="lab">Technician<select id="nj-tech"><option>Sam</option><option>Jo</option></select></label><p class="hint" style="margin-top:8px">Added to '+D5[st.mday]+'.</p><button style="width:100%" data-addjob>Add job</button></div>';
 ['Sam','Jo'].forEach(function(t){var L=ALL.filter(function(j){return j.day==st.mday&&j.tech==t});
  h+='<div class="tech"><h3>'+t+' <small style="font-weight:500;color:var(--mute)">'+L.length+' jobs</small></h3>';
  if(!L.length)h+='<p class="hint" style="margin:8px 0 0">Nothing scheduled.</p>';
  L.forEach(function(j){h+='<div class="mj"><h3>'+j.name+'</h3><p class="hint" style="margin:0 0 6px">'+j.addr+'</p><div class="row" style="justify-content:space-between"><span class="pill'+(j.one?' one':'')+'">'+j.type+'</span>'+(st.done[j.id]?'<span class="pill">Done</span>':'<select data-assign="'+j.id+'" aria-label="Assign to"><option'+(j.tech=='Sam'?' selected':'')+'>Sam</option><option'+(j.tech=='Jo'?' selected':'')+'>Jo</option></select>')+'</div>'+(j.one&&custByName(j.name)&&!custByName(j.name).freq?'<button class="alt" style="margin-top:8px" data-recur="'+custByName(j.name).id+'">Make recurring</button>':'')+'</div>'});
  h+='</div>'});
 return h+'<p class="note"><button class="alt" data-reset>Reset demo data</button></p><p class="note">Prototype: moving one of today’s jobs between Sam and Jo changes Sam’s route when you sign in as him.</p>'}
function addjob(){var n=$('#nj-name').value.trim(),a=$('#nj-addr').value.trim();if(!n||!a){alert('Enter a customer name and an address, like 8 High St, Kyneton.');return}
 if(a.indexOf('VIC')<0)a+=' VIC';var ty=$('#nj-type').value;ALL.push({id:Date.now()%1000000,name:n,addr:a,type:ty,one:true,access:'No access notes yet.',tech:$('#nj-tech').value,day:st.mday});if(!custByName(n))CUST.push({id:Date.now()%1000000+1,name:n,phone:$('#nj-phone').value.trim(),email:'',addr:a,access:'',freq:'',day:st.mday,tech:''});st.add=false;render()}
function save(){try{localStorage.setItem('sps1',JSON.stringify({k:KEY,ALL:ALL,CUST:CUST,done:st.done,data:st.data}))}catch(e){}}
function load(){try{var x=JSON.parse(localStorage.getItem('sps1')||'null');if(x&&x.k===KEY){ALL.length=0;x.ALL.forEach(function(j){ALL.push(j)});CUST.length=0;x.CUST.forEach(function(c){CUST.push(c)});st.done=x.done;st.data=x.data}}catch(e){}}
function render(){save();sync();var a=$('#app'),u=st.user;$('#who').innerHTML=u?u.name+'<button class="alt sign" data-out>Sign out</button>':'';
 a.innerHTML=!u?login():u.role=='mgr'?mgr():st.view=='day'?day():st.view=='visit'?visit():finished();
 if(u&&u.role=='tech'&&st.view=='day'&&!jobs.length)a.insertAdjacentHTML('beforeend','<p class="hint">No jobs assigned to you today.</p>');window.scrollTo(0,0)}

function keep(){var y=window.scrollY;var a=$('#app');a.innerHTML=visit();window.scrollTo(0,y)}
document.addEventListener('click',function(e){var t=e.target.closest('button,header');if(!t)return;
 if(t.dataset.body){st.body=t.dataset.body;keep()}
 else if(t.hasAttribute('data-adddose')){adddose()}
 else if(t.dataset.rm){D().doses.splice(+t.dataset.rm,1);keep()}
 else if(t.hasAttribute('data-copy')){copysum()}
 else if(t.hasAttribute('data-reset')){try{localStorage.removeItem('sps1')}catch(e){}location.reload()}
 else if(t.dataset.tab){st.mtab=t.dataset.tab;st.cid=null;st.recur=null;render()}
 else if(t.dataset.cust){st.cid=+t.dataset.cust;render()}
 else if(t.hasAttribute('data-cback')){st.cid=null;st.recur=null;render()}
 else if(t.hasAttribute('data-addcust')){st.cform=!st.cform;render()}
 else if(t.hasAttribute('data-savecust')){savecust()}
 else if(t.dataset.recur){st.mtab='cust';st.cid=+t.dataset.recur;st.recur=st.cid;render()}
 else if(t.dataset.saverecur){var c=custByName(CUST.filter(function(x){return x.id==st.cid})[0].name);mkJob(c,$('#rc-freq').value,+$('#rc-day').value,$('#rc-tech').value);st.recur=null;render()}
 else if(t.dataset.login){st.user=t.dataset.login=='mgr'?{role:'mgr',name:'Alex, manager'}:{role:'tech',name:'Sam, technician'};st.view='day';render()}
 else if(t.hasAttribute('data-out')){st.user=null;st.view='day';render()}
 else if(t.dataset.mday){st.mday=+t.dataset.mday;render()}
 else if(t.hasAttribute('data-addform')){st.add=!st.add;render()}
 else if(t.hasAttribute('data-addjob')){addjob()}
 else if(t.dataset.open){st.job=+t.dataset.open;st.view='visit';st.open=1;render()}
 else if(t.hasAttribute('data-back')){st.view='day';render()}
 else if(t.hasAttribute('data-gmaps')){gmaps()}
 else if(t.dataset.nav){alert('Opens Google Maps or Apple Maps with this address.')}
 else if(t.dataset.step){st.open=st.open==t.dataset.step?0:+t.dataset.step;keep()}
 else if(t.dataset.t){var d=D();d[t.dataset.t]=now();keep()}
 else if(t.hasAttribute('data-photo')){alert('Opens the camera and attaches the photo to this visit.')}
 else if(t.hasAttribute('data-finish')&&!t.disabled){st.done[st.job]=true;st.view='fin';render()}});
document.addEventListener('input',function(e){if(e.target.id=='cq'){st.cq=e.target.value;$('#clist').innerHTML=clist()}});
document.addEventListener('change',function(e){var t=e.target;if(t.dataset&&t.dataset.assign){ALL.filter(function(j){return j.id==t.dataset.assign})[0].tech=t.value;render()}});
document.addEventListener('change',function(e){var t=e.target,d=st.job&&D();if(t.dataset.c){d.chk[t.dataset.c]=t.checked;keep()}});
document.addEventListener('input',function(e){var t=e.target,d=st.job&&D();
 if(t.dataset.f)d[t.dataset.f]=t.value;
 if(t.dataset.chem){d.r[st.body][t.dataset.chem]=t.value;var c=chem.filter(function(x){return x.k==t.dataset.chem})[0],r=rng(c,t.value),f=t.closest('.fld'),s=f.querySelector('small');
  if(!s){s=document.createElement('small');f.appendChild(s)}
  if(r){s.className=r[0];s.textContent=r[1]}else s.remove()}});
document.addEventListener('focusout',function(e){if(e.target.dataset&&(e.target.dataset.chem||e.target.dataset.f)&&st.view=='visit')setTimeout(function(){if(!document.activeElement||document.activeElement===document.body)keep()},0)});
document.addEventListener('input',save);load();render();
if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js')});
</script>
</body>
</html>
